steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/linebot-gcp-insight-advisor:$SHORT_SHA', '.']

  # 2. Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/linebot-gcp-insight-advisor:$SHORT_SHA']

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'linebot-gcp-insight-advisor'
      - '--image'
      - 'gcr.io/$PROJECT_ID/linebot-gcp-insight-advisor:$SHORT_SHA'
      - '--region'
      - 'asia-east1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'LINE_CHANNEL_ACCESS_TOKEN=${_LINE_ACCESS_TOKEN},LINE_CHANNEL_SECRET=${_LINE_SECRET},GOOGLE_API_KEY=${_GOOGLE_API_KEY}'

images:
  - 'gcr.io/$PROJECT_ID/linebot-gcp-insight-advisor:$SHORT_SHA'

substitutions:
  _LINE_ACCESS_TOKEN: 'placeholder'
  _LINE_SECRET: 'placeholder'
  _GOOGLE_API_KEY: 'placeholder'
